<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, Open Graph + JSON-LD are PRERENDERED per
         route by the Seo/Schema components. Don't add a static title/description
         here — it would duplicate the per-page head on every prerendered page. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-charcoal-dark">
    <div id="root"></div>

    <!-- Netlify Forms detection — static form so Netlify registers "contact" at build time.
         The real (React) form on /contact submits to this via fetch. Keep field names in sync. -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
